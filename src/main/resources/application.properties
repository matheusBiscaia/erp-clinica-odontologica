spring.application.name=erp
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/erp_clinica}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${DB_DDL_MODE:update}
spring.jpa.open-in-view=false
spring.web.error.include-stacktrace=never

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.auth.initial-registration=${INITIAL_REGISTRATION_ENABLED:false}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
